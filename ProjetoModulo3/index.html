<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <!-- Define o padrão de caracteres (permite acentos e símbolos) -->
  <meta charset="UTF-8">

  <!-- Faz o site se adaptar a celular e diferentes telas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Nome que aparece na aba do navegador -->
  <title>Copa 2026</title>

  <!-- Importa o arquivo CSS para estilizar o site -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- Menu lateral que irá mostrar a lista das seleções -->
  <aside id="menuLateral">

    <!-- Título do menu -->
    <h2>Seleções</h2>

    <!-- Local onde o JavaScript adicionará os países -->
    <div id="listaPaises"></div>

  </aside>

  <!-- Conteúdo principal da página -->
  <main class="container">

    <!-- Título principal -->
    <h1>Copa do Mundo 2026</h1>

    <!-- Texto de instrução para o usuário -->
    <p>Escolha uma seleção para ver os detalhes.</p>

    <!-- Área onde o JavaScript mostrará as informações -->
    <div id="app"></div>

  </main>

  <!-- Importa o JavaScript para adicionar funções ao site -->
  <script src="script.js"></script>

</body>
</html>
